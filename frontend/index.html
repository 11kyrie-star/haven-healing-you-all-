<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven</title>
    <style>
      /* 首屏占位：纯内联样式，不额外请求资源，JS 挂载后由 main.ts 移除 */
      html,
      body {
        background: #f5efe9;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5efe9;
        color: #3c1e1e;
        transition: opacity 0.28s ease;
      }
      #app-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-loading .loading-title {
        font: 400 44px/1 Georgia, "Times New Roman", serif;
        letter-spacing: 0.06em;
        color: rgba(60, 30, 30, 0.85);
      }
      #app-loading .loading-sub {
        font: 400 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.18em;
        color: rgba(60, 30, 30, 0.45);
      }
      #app-loading .loading-bar {
        width: 132px;
        height: 2px;
        margin-top: 6px;
        overflow: hidden;
        background: rgba(60, 30, 30, 0.12);
        border-radius: 999px;
      }
      #app-loading .loading-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: rgba(60, 30, 30, 0.45);
        animation: loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes loading-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .loading-bar span {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" role="status" aria-live="polite">
      <div class="loading-title">Haven</div>
      <div class="loading-sub">HEAL ALL YOUR WOUNDS</div>
      <div class="loading-bar"><span></span></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
