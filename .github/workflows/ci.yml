name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        
jobs:
    frontend:
        name: 前端检查
        runs-on: ubuntu-latest

        defaults:
            run:
                 working-directory: frontend
        steps:
            - name: 拉取仓库代码
              uses: actions/checkout@v4
            
            - name: 安装node.js并缓存依赖
              uses: actions/setup-node@v4
              with:
                 node-version: 24
                 cache: npm
                 cache-dependency-path: frontend/package-lock.json
            
            - name: 安装依赖
              run: npm ci 
             
            - name: 代码检查(oxlint)
              run: npx oxlint . 
            - name: 代码检查(eslint) 
              run: npx eslint . 
            - name: 类型检查 
              run: npm run type-check 
            - name: 构建 
              run: npm run build-only

    backend:
        name: 后端检查
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend
        steps:
            - name: 拉取仓库代码
              uses: actions/checkout@v4

            - name: 安装node.js并缓存依赖
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: 安装依赖
              run: npm ci

            - name: JS 语法检查
              run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
